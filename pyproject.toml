[project]
name = "developer-platform-ai-agents"
version = "0.1.0"
description = "Developer platform for AI agents with REST, GraphQL, MCP, SDKs, and realtime events"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "strawberry-graphql[fastapi]>=0.269.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0.32",
  "sse-starlette>=2.1.3",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.23.8"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*", "devplatform*"]